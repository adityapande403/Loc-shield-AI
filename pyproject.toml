[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localshield"
version = "0.1.0"
description = "Privacy-First Local PII Detection & Redaction Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "LocalShield AI Team", email = "privacy@localshield.internal"}
]
keywords = ["privacy", "pii", "redaction", "nlp", "token-classification", "onnx", "security"]
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "cryptography>=42.0.0",
    "regex>=2023.10.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
localshield = "localshield.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
